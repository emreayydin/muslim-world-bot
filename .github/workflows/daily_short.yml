name: Daily Islamic Short

on:
  schedule:
    # Hourly ONLY during the audience's active window. Analytics (Aug 2026) show
    # peak viewer activity 15:00-21:00 GMT+3 (= 12:00-18:00 UTC), ramping from
    # ~11:00 GMT+3. So we fire 08:00-20:00 UTC (= 11:00-23:00 GMT+3) and let
    # main.py self-throttle to 6/day with >=2h spacing — every upload lands in the
    # active window, none in the dead night hours. Over-scheduled (13 triggers) to
    # survive GitHub's flaky cron.
    - cron: "0 8-20 * * *"
  workflow_dispatch:
    inputs:
      type:
        description: "Content type (empty = by hour)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no upload)"
        type: boolean
        default: false

permissions:
  contents: write   # allows committing history.json back to the repo

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate & Upload Short
        working-directory: src
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          FAL_KEY: ${{ secrets.FAL_KEY }}   # AI images; falls back to Pexels if unset
          AI_VIDEO: "1"                     # animate the hook (first ~5s) via LTX (~$0.02/short)
          AI_IMAGE_MAX: "0"                 # budget: hook video + free Pexels body (~$0.06/short)
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=()
          if [ -n "${{ github.event.inputs.type }}" ]; then
            ARGS+=(--type "${{ github.event.inputs.type }}")
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python main.py "${ARGS[@]}"

      - name: Save history (avoid repeats next run)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          if ! git diff --staged --quiet; then
            git commit -m "Update history [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Upload video artifact (dry run only)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: islamic-short
          path: src/output/*.mp4
          retention-days: 7
