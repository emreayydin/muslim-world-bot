name: Sammlung nachfuellen (kostenlos)

# Seit 07.10.2026: fuellt taeglich die Sammlung (nur Koran-Inhalte) auf, ohne Mac und ohne
# Kosten. Schreiben und Pruefen ueber Gratis-Kontingente (Groq, Mistral,
# Gemini - automatischer Wechsel, scripts/ki_kern.py); jeder Eintrag wird gegen
# den echten Verstext (api.alquran.cloud) gegengelesen. Taeglich kleine Mengen statt einmal pro Woche viel:
# so reichen die Tageslimits, und ein ausgefallener Tag holt sich selbst auf.
on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:
    inputs:
      anzahl:
        description: "Hoechstens so viele neue Eintraege (leer = automatisch)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: content-bank-nachfuellen

jobs:
  nachfuellen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Eintraege schreiben und pruefen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "${{ github.event.inputs.anzahl }}" ]; then
            python scripts/content_bank_nachfuellen.py --anzahl "${{ github.event.inputs.anzahl }}"
          else
            python scripts/content_bank_nachfuellen.py
          fi
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content_bank_neu.py 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Sammlung: neue gepruefte Eintraege [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 10
            done
          fi
